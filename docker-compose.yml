services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-misty}
      POSTGRES_USER: ${POSTGRES_USER:-misty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-misty-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misty} -d ${POSTGRES_DB:-misty}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  object-storage:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-misty-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-misty-local-only-change-me}
      S3_BUCKET: ${S3_BUCKET:-misty-local}
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - object-storage-data:/data

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
