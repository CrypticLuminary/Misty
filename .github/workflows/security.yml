name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # main
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 is transitively pulled by SQLx's MySQL support even though Misty
      # enables PostgreSQL only. cargo-audit has no target/feature filtering for this case.
      # Keep the advisory explicit; remove this ignore as soon as upstream removes/fixes it.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm --dir apps/web install --no-frozen-lockfile
      - run: pnpm --dir apps/web audit --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
