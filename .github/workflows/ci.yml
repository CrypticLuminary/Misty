name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: misty
          POSTGRES_USER: misty
          POSTGRES_PASSWORD: misty-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U misty -d misty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://misty:misty-ci@localhost:5432/misty
      MISTY_BIND_ADDR: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Configuration rejection smoke test
        run: |
          if env -u DATABASE_URL cargo run --locked -p misty-api > /tmp/misty-config.log 2>&1; then
            echo "API unexpectedly started without DATABASE_URL" >&2
            exit 1
          fi
          grep -q "required environment variable DATABASE_URL is missing" /tmp/misty-config.log
      - name: Media worker smoke test
        run: cargo run --locked -p misty-media-worker 2>&1 | grep -q "misty media worker foundation ready"
      - name: API migration, health, request-ID and readiness smoke test
        run: |
          cargo run --locked -p misty-api > /tmp/misty-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/misty-api.log' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ready | grep -q '"status":"ready"'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "API did not become ready" >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          curl --fail --silent --dump-header /tmp/misty-headers.txt \
            --header "x-request-id: misty-ci-request-id" \
            http://127.0.0.1:8080/health > /tmp/misty-health.json
          grep -qi '^x-request-id: misty-ci-request-id' /tmp/misty-headers.txt

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.17"
      - run: uv sync --project workers/ai --frozen
      - run: uv run --project workers/ai ruff check workers/ai
      - run: uv run --project workers/ai mypy workers/ai/src
      - run: PYTHONPATH=workers/ai/src uv run --project workers/ai pytest workers/ai/tests


  local-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Pull pinned infrastructure images
        run: docker compose pull postgres redis minio
      - name: Start and verify local infrastructure
        run: |
          docker compose up -d postgres redis minio
          trap 'docker compose logs --no-color; docker compose down -v' EXIT

          for service in postgres redis minio; do
            container_id="$(docker compose ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "$service did not create a container" >&2
              exit 1
            fi

            healthy=false
            for attempt in {1..30}; do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "$service entered terminal state: $status" >&2
                exit 1
              fi
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              echo "$service did not become healthy" >&2
              exit 1
            fi
          done
